<!DOCTYPE html>
<head>
    <title>Knowledge Base</title>
    <style>
        /* ── All colors inherit from --sf-* variables (no hard-coded light/dark colors) ── */

        #kbPopup {
            --kb-sidebar-bg:    var(--sf-dark-3, #f5f5f5);
            --kb-sidebar-border:var(--sf-dark-4, #dee2e6);
            --kb-content-bg:    var(--sf-dark-2, #ffffff);
            --kb-text:          var(--sf-text-bright, #212529);
            --kb-text-dim:      var(--sf-text-dim, #6c757d);
            --kb-input-bg:      var(--sf-dark, #ffffff);
            --kb-input-border:  var(--sf-dark-4, #ced4da);
            --kb-input-text:    var(--sf-text-bright, #212529);
            --kb-code-bg:       var(--sf-dark-3, #f8f9fa);
        }

        /* Sand theme overrides */
        body.sf-theme-sand #kbPopup {
            --kb-sidebar-bg:     #f0f4f8;
            --kb-sidebar-border: #d1d9e0;
            --kb-content-bg:     #ffffff;
            --kb-text:           #1e293b;
            --kb-text-dim:       #64748b;
            --kb-input-bg:       #ffffff;
            --kb-input-border:   #cbd5e1;
            --kb-input-text:     #1e293b;
            --kb-code-bg:        #f1f5f9;
        }

        #kbPopup .kb-layout {
            display: flex;
            gap: 0;
            height: 480px;
        }

        /* ── Left: document list ─────────────────────────── */
        #kbPopup .kb-left {
            width: 42%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--kb-sidebar-border);
            background: var(--kb-sidebar-bg);
        }

        #kbPopup .kb-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--kb-sidebar-border);
            flex-shrink: 0;
        }

        #kbDocumentGrid {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        /* ── Right: detail form ──────────────────────────── */
        #kbPopup .kb-right {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: var(--kb-content-bg);
            overflow-y: auto;
            padding: 14px 16px;
        }

        #kbPopup .kb-field {
            margin-bottom: 12px;
        }
        #kbPopup .kb-label {
            display: block;
            margin-bottom: 4px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--kb-text-dim);
        }
        #kbPopup .kb-input,
        #kbPopup .kb-textarea {
            width: 100%;
            padding: 6px 10px;
            font-size: 13px;
            color: var(--kb-input-text);
            background: var(--kb-input-bg);
            border: 1px solid var(--kb-input-border);
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #kbPopup .kb-input:focus,
        #kbPopup .kb-textarea:focus {
            border-color: var(--sf-blue, #17a2b8);
            box-shadow: 0 0 0 2px rgba(23,162,184,.15);
        }
        #kbPopup .kb-textarea {
            resize: vertical;
            min-height: 80px;
        }
        #kbPopup #kbMetadataTextarea {
            min-height: 100px;
            font-family: monospace;
            font-size: 12px;
            background: var(--kb-code-bg);
        }

        /* ── Loading overlay ─────────────────────────────── */
        .kb-loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.12);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .kb-loading-overlay.show { display: flex; }
        .kb-loading-bar {
            width: 50%;
            max-width: 280px;
            height: 4px;
            background: var(--kb-sidebar-border);
            border-radius: 4px;
            overflow: hidden;
        }
        .kb-loading-bar-inner {
            height: 100%;
            background: var(--sf-blue, #17a2b8);
            background-image: linear-gradient(90deg,
                transparent 0%, rgba(255,255,255,.35) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: kb-shimmer 1.2s linear infinite;
        }
        @keyframes kb-shimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="modal-body" style="padding: 0; overflow: hidden;">
        <div id="kbPopup">
            <div class="kb-layout">

                <!-- Left: document grid -->
                <div class="kb-left">
                    <div class="kb-toolbar">
                        <button class="btn btn-info btn-sm" onclick="kbmanager.search();">
                            <span class="lang" as="kb.search"></span>
                        </button>
                        <button class="btn btn-secondary btn-sm" onclick="kbmanager.refresh();">
                            <span class="lang" as="refresh"></span>
                        </button>
                    </div>
                    <div id="kbDocumentGrid">
                        <div id="kbLoadingOverlay" class="kb-loading-overlay">
                            <div class="kb-loading-bar">
                                <div class="kb-loading-bar-inner"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: detail form -->
                <div class="kb-right">
                    <form id="kbDocumentForm">
                        <div class="kb-field">
                            <label class="kb-label"><span class="lang" as="kb.question"></span></label>
                            <input type="text" id="kbQuestion" class="kb-input" />
                        </div>
                        <div class="kb-field">
                            <label class="kb-label"><span class="lang" as="kb.intent"></span></label>
                            <input type="text" id="kbIntent" class="kb-input" />
                        </div>
                        <div class="kb-field">
                            <label class="kb-label"><span class="lang" as="kb.answer"></span></label>
                            <textarea id="kbAnswer" class="kb-textarea" rows="4"></textarea>
                        </div>
                        <div class="kb-field">
                            <label class="kb-label"><span class="lang" as="kb.metadata"></span></label>
                            <textarea id="kbMetadataTextarea" class="kb-textarea" readonly rows="5"></textarea>
                        </div>
                    </form>
                </div>

            </div><!-- /.kb-layout -->
        </div><!-- /#kbPopup -->
    </div>

    <div class="modal-footer d-flex justify-content-end align-items-center gap-2">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" aria-hidden="true">
            <span class="lang" as="cancel">Cancel</span>
        </button>
        <button type="button" class="btn btn-primary" onclick="kbmanager.save();">
            <span class="lang" as="save">Save</span>
        </button>
    </div>

    <script type="text/javascript">
        $(function () {
            kresource.localize();
            kbmanager.init();
        });
    </script>
</body>
</html>
