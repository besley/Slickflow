<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Rule Set</title>
    <style type="text/css">
        .ag-header-cell {
            background-color: #49afcd;
        }
        .ruleset-container {
            display: flex;
            flex-wrap: nowrap;
            min-height: 560px;
            height: 560px;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        .ruleset-list {
            flex: 0 0 40%;
            min-width: 280px;
            min-height: 0;
            min-width: 0;
            box-sizing: border-box;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .ruleset-splitter {
            flex: 0 0 8px;
            cursor: col-resize;
            background: linear-gradient(to right, #edf2f7, #dbe4ef, #edf2f7);
            border-left: 1px solid #d8e1ec;
            border-right: 1px solid #d8e1ec;
            position: relative;
            z-index: 2;
        }
        .ruleset-splitter::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translateX(-50%);
            width: 2px;
            height: 30%;
            border-radius: 2px;
            background-color: #94a3b8;
        }
        .ruleset-splitter:hover {
            background: linear-gradient(to right, #dbe4ef, #c9d8ea, #dbe4ef);
        }
        .ruleset-editor {
            flex: 1 1 60%;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-sizing: border-box;
            padding-left: 10px;
            height: 100%;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .ruleset-grid-wrap {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
        }
        .ruleset-list-body {
            height: 100%;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
        }
        .ruleset-toolbar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            padding: 0 0 8px 0;
        }
        #myRuleSetGrid {
            width: 100%;
            height: 100%;
            min-width: 0;
        }
        .ruleset-editor .CodeMirror {
            height: 320px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow: hidden;
        }
        .ruleset-meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .ruleset-meta-row .form-group {
            flex: 1 1 160px;
        }
        .ruleset-content-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ruleset-help-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #2b6cb0;
            color: #2b6cb0;
            background: #ebf8ff;
            font-weight: 700;
            line-height: 20px;
            text-align: center;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="modal-body">
        <div class="ruleset-container">
            <div class="ruleset-list">
                <div class="ruleset-list-body">
                    <div class="ruleset-toolbar">
                        <button type="button" class="btn btn-sm btn-primary" onclick="ruleset.createNew();">
                            <span class="lang" as="create"></span>
                        </button>
                        <button type="button" class="btn btn-sm btn-success" onclick="ruleset.refresh();">
                            <span class="lang" as="refresh"></span>
                        </button>
                    </div>
                    <div id="myRuleSetGrid" class="ag-theme-balham ruleset-grid-wrap"></div>
                </div>
            </div>
            <div id="rulesetSplitter" class="ruleset-splitter"></div>
            <div class="ruleset-editor">
                <div class="ruleset-meta-row">
                    <div class="form-group">
                        <label><span class="lang" as="code"></span></label>
                        <input class="form-control" id="txtRuleSetCode" maxlength="50" />
                    </div>
                    <div class="form-group">
                        <label><span class="lang" as="name"></span></label>
                        <input class="form-control" id="txtRuleSetName" maxlength="200" />
                    </div>
                </div>
                <div class="form-group">
                    <label>Mode</label>
                    <select class="form-control" id="ddlRuleSetMode">
                        <option value="ruleTypes">ruleTypes — NRules types in rule_content</option>
                        <option value="bindingsJson">bindingsJson — JSON rules in rule_content</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><span class="lang" as="description"></span></label>
                    <input class="form-control" id="txtRuleSetDesc" maxlength="500" />
                </div>
                <div class="form-group" style="flex:1; display:flex; flex-direction:column; min-height:340px;">
                    <label class="ruleset-content-label">
                        <span>Content</span>
                        <button type="button" class="ruleset-help-btn" title="Help" onclick="ruleset.showExampleHelp();">?</button>
                    </label>
                    <textarea id="txtRuleSetContent" class="form-control" style="min-height:320px;overflow:hidden;"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button class="btn btn-primary lang" as="save" onclick="ruleset.save();"></button>
        <button class="btn btn-danger lang" as="delete" onclick="ruleset.deleteCurrent();"></button>
        <button class="btn lang" data-dismiss="modal" aria-hidden="true" as="cancel"></button>
    </div>

    <script type="text/javascript">
        $(function () {
            // Localization for elements in this fragment;
            // ruleset.init is invoked from kmain.openRuleSetEditor after the dialog is shown.
            if (window.kresource) {
                kresource.localize();
            }
        });
    </script>
</body>
</html>
